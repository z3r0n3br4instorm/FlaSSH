name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Version is computed before anything is compiled so the binaries can be
  # stamped with the same tag the release is published under — otherwise the
  # banner would report a stale version.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: compute
        run: |
          latest=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  # Tests run inside each build job rather than as a separate gate: it avoids
  # a second dependency install (the step that hung for an hour), exercises
  # the tests on every platform we ship, and means one flaky apt run can no
  # longer block the whole pipeline.
  build-unix:
    needs: version
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: flassh-linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact: flassh-linux-arm64
          # Runner labels get retired: macos-13 was removed by GitHub and any
          # job requesting it queues forever (timeout-minutes does not cover
          # time spent waiting for a runner, only execution). macos-14 is
          # deprecated too, so both macOS legs target 15.
          - runner: macos-15        # Apple silicon
            artifact: flassh-macos-arm64
          - runner: macos-15-intel  # Intel
            artifact: flassh-macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # DEBIAN_FRONTEND stops any debconf prompt from blocking on stdin, and
      # the retry loop rides out the transient mirror failures that left this
      # step hanging indefinitely once already.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 8
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          for attempt in 1 2 3; do
            if sudo -E apt-get update -qq && \
               sudo -E apt-get install -y -qq --no-install-recommends libssh-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying..." >&2
            sleep 10
          done
          echo "apt-get failed after 3 attempts" >&2
          exit 1

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: brew install libssh

      - name: Build
        run: |
          make clean
          make VERSION="${{ needs.version.outputs.version }}"

      - name: Run unit tests
        run: make test

      # Checks the compiled binary rather than running it: the banner only
      # prints once a host argument is supplied, so `bin/fssh` on its own
      # would never show the version.
      - name: Verify version was baked in
        run: |
          if ! strings bin/fssh | grep -qx "${{ needs.version.outputs.version }}"; then
            echo "Binary does not contain ${{ needs.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Package binary
        run: cp bin/fssh "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # FlaSSH is built on POSIX terminal APIs (termios, TIOCGWINSZ, poll on
  # stdin, SIGWINCH, getpass) that native Windows does not provide, so this
  # builds against the MSYS2 POSIX emulation layer rather than natively. The
  # resulting .exe needs msys-2.0.dll beside it. It is allowed to fail
  # without blocking a release — see the README for the full caveat.
  build-windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            gcc
            make
            libssh-devel
            binutils

      - name: Build
        run: |
          make clean
          make VERSION="${{ needs.version.outputs.version }}"

      - name: Package binary
        run: cp bin/fssh flassh-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flassh-windows-x86_64
          path: flassh-windows-x86_64.exe

  release:
    needs: [version, build-unix, build-windows]
    if: always() && needs.build-unix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.version.outputs.version }}"
          git push origin "${{ needs.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.version }}" \
            artifacts/* \
            --title "FlaSSH ${{ needs.version.outputs.version }}" \
            --generate-notes
