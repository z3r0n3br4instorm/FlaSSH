name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Version is computed before anything is compiled so the binaries can be
  # stamped with the same tag the release is published under — otherwise the
  # banner would report a stale version.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: compute
        run: |
          latest=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS='.' read -r major minor patch <<< "${latest#v}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "Next version: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssh-dev
      - name: Run unit tests
        run: make test

  build-unix:
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: flassh-linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact: flassh-linux-arm64
          - runner: macos-14        # Apple silicon
            artifact: flassh-macos-arm64
          - runner: macos-13        # Intel
            artifact: flassh-macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssh-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libssh

      - name: Build
        run: |
          make clean
          make VERSION="${{ needs.version.outputs.version }}"

      # Checks the compiled binary rather than running it: the banner only
      # prints once a host argument is supplied, so `bin/fssh` on its own
      # would never show the version.
      - name: Verify version was baked in
        run: |
          if ! strings bin/fssh | grep -qx "${{ needs.version.outputs.version }}"; then
            echo "Binary does not contain ${{ needs.version.outputs.version }}" >&2
            exit 1
          fi

      - name: Package binary
        run: cp bin/fssh "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  # FlaSSH is built on POSIX terminal APIs (termios, TIOCGWINSZ, poll on
  # stdin, SIGWINCH, getpass) that native Windows does not provide, so this
  # builds against the MSYS2 POSIX emulation layer rather than natively. The
  # resulting .exe needs msys-2.0.dll beside it. It is allowed to fail
  # without blocking a release — see the README for the full caveat.
  build-windows:
    needs: [version, test]
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            gcc
            make
            libssh-devel
            binutils

      - name: Build
        run: |
          make clean
          make VERSION="${{ needs.version.outputs.version }}"

      - name: Package binary
        run: cp bin/fssh flassh-windows-x86_64.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flassh-windows-x86_64
          path: flassh-windows-x86_64.exe

  release:
    needs: [version, build-unix, build-windows]
    if: always() && needs.build-unix.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.version.outputs.version }}"
          git push origin "${{ needs.version.outputs.version }}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.version }}" \
            artifacts/* \
            --title "FlaSSH ${{ needs.version.outputs.version }}" \
            --generate-notes
